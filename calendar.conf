-- Next calendar events, bottom-right of the 2nd monitor (HDMI-A-1), above
-- the weather widget. Drawn by lua/calendar.lua; data from
-- scripts/calendar.py (KDE Akonadi's local copy of the CalDAV calendars).
-- Runs as its own conky instance:  conky -c ~/.config/conky/calendar.conf
--
-- HDMI-A-1 is at +2560+360 on the XWayland screen. The window's top-left is
-- (1200, 665) on the monitor: gap_x 3760, gap_y 1025 (WIN_MX/WIN_MY in
-- lua/calendar.lua, which places the card inside it).

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('calendar', {
    update_interval = 5,        -- redraw every 5 s; the data itself refreshes every 60 s
    gap_x = 3760,
    gap_y = 1025,
    minimum_width = 700,
    maximum_width = 700,
    minimum_height = 220,
})

-- Every 60 s: read the events and save them for the Lua script. Written to a
-- temp file first, and only kept if the script produced something, so a
-- failed read leaves the previous data (which then shows as stale).
conky.text = [[
${execi 60 mkdir -p ~/.cache/conky && python3 -I ~/.config/conky/scripts/calendar.py > ~/.cache/conky/calendar.tmp && [ -s ~/.cache/conky/calendar.tmp ] && mv ~/.cache/conky/calendar.tmp ~/.cache/conky/calendar}
]]
