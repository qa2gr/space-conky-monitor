-- Settings every widget shares (not a widget itself: don't run it directly).
--
-- Each widget's .conf builds its config from this with its name and only
-- what's its own (position, size, update interval...):
--
--   local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')
--   conky.config = widget('claude', { gap_x = 3460, ... })
--
-- The name gives the Lua file (lua/<name>.lua), its draw function
-- (conky_draw_<name>) and the window title/class (conky-<name>). Anything
-- passed in replaces the value here.
--
-- Conky only reloads a widget when its own .conf changes: after editing this
-- file, re-run start.sh.

local base = {
    background = true,
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,
    -- X11 (XWayland on the Wayland desktop), so gap_x/gap_y place the window.
    -- Positions are absolute on the XWayland screen with top_left: conky
    -- measures right/bottom alignments from the first monitor only.
    output_backend = 'x11',
    alignment = 'top_left',

    -- An undecorated, fully see-through window behind everything
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_color = '00000000',

    border_inner_margin = 0,
    border_outer_margin = 0,

    -- Everything is drawn by the Lua scripts; conky's own text drawing is
    -- off, and this font only spares conky looking for its X11 default.
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'Noto Sans:size=10',
}

return function(name, own)
    local config = {}
    for k, v in pairs(base) do config[k] = v end
    config.lua_load = '~/.config/conky/lua/' .. name .. '.lua'
    config.lua_draw_hook_post = 'draw_' .. name
    config.own_window_title = 'conky-' .. name
    config.own_window_class = 'conky-' .. name
    for k, v in pairs(own or {}) do config[k] = v end
    return config
end
