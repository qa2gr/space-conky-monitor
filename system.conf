-- System monitor (kernel/uptime, memory, processor, GPU, disks, network),
-- left side of HDMI-A-1. Drawn by lua/system.lua.
-- Runs as its own conky instance:  conky -c ~/.config/conky/system.conf
--
-- HDMI-A-1 is at +2560+360 on the XWayland screen: gap_x 2590 puts the
-- content 20 px from its left edge, gap_y 450 is 90 px down it.
-- lua/system.lua reads gap_x/gap_y from this file to place the curve
-- around the wallpaper's round window, so keep them as plain numbers.

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('system', {
    gap_x = 2590,
    gap_y = 450,
    -- 575 wide: 400 px of content + card padding, plus the cards' extension
    -- towards the round window (EDGE_MX in lua/system.lua). 950 tall: the
    -- cards are spread over this height (from 90 px down HDMI-A-1 to ~24 px
    -- above its bottom).
    minimum_width = 575,
    maximum_width = 575,
    minimum_height = 950,
    -- lua/system.lua lays the cards out inside this margin (text_start_x/y).
    border_inner_margin = 8,
})

-- No text: everything is drawn by lua/system.lua.
conky.text = [[
]]
