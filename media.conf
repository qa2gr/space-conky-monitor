-- Media widget fitted to the round window of the HDMI-A-1 wallpaper:
-- the progress bar follows the bottom of the glass. Drawn by lua/media.lua.
-- Runs as its own conky instance:  conky -c ~/.config/conky/media.conf
--
-- The window covers the lower part of the wallpaper's glass circle (centre
-- (960, 540), radius ~391 on HDMI-A-1). HDMI-A-1 is at +2560+360 on the
-- XWayland screen, so its (560, 600) is gap_x 3120, gap_y 960.
-- If you move it, update CX/CY in lua/media.lua.

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('media', {
    gap_x = 3120,
    gap_y = 960,
    minimum_width = 800,
    maximum_width = 800,
    minimum_height = 420,
})

-- media.py writes ~/.cache/conky/media-state; it prints nothing.
conky.text = [[
${execi 1 ~/.config/conky/scripts/media.py}
]]
