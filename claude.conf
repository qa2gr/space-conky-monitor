-- Claude usage widget fitted to the round window of the HDMI-A-1 wallpaper:
-- two arcs follow the top-right of the glass. Drawn by lua/claude.lua.
-- Runs as its own conky instance:  conky -c ~/.config/conky/claude.conf
--
-- The window covers the top-right of the wallpaper's glass circle (centre
-- (960, 540), radius ~391 on HDMI-A-1). HDMI-A-1 is at +2560+360 on the
-- XWayland screen, so its (900, 120) is gap_x 3460, gap_y 480.
-- If you move it, update CX/CY in lua/claude.lua.

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('claude', {
    gap_x = 3460,
    gap_y = 480,
    minimum_width = 500,
    maximum_width = 500,
    minimum_height = 400,
})

conky.text = [[
]]
