-- Self-hosted services status, top-right of the 2nd monitor (HDMI-A-1).
-- Drawn by lua/services.lua; data from scripts/services.sh (Uptime Kuma).
-- Runs as its own conky instance:  conky -c ~/.config/conky/services.conf
--
-- HDMI-A-1 is at +2560+360 on the XWayland screen. The window's top-left is
-- (1200, 70) on the monitor: gap_x 3760, gap_y 430 (WIN_MX/WIN_MY in
-- lua/services.lua, which places the card inside it).
-- (Conky measures right/bottom alignments from the first monitor, so
-- top_left with absolute gaps is used.)

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('services', {
    update_interval = 5,        -- redraw every 5 s; the data itself refreshes every 60 s
    gap_x = 3760,
    gap_y = 430,
    minimum_width = 700,
    maximum_width = 700,
    minimum_height = 120,
})

-- Every 60 s: fetch the status page and save it for the Lua script. Written to
-- a temp file first, and only kept if the fetch produced something, so a
-- failed fetch leaves the previous data (which then shows as stale).
conky.text = [[
${execi 60 mkdir -p ~/.cache/conky && ~/.config/conky/scripts/services.sh > ~/.cache/conky/services.tmp && [ -s ~/.cache/conky/services.tmp ] && mv ~/.cache/conky/services.tmp ~/.cache/conky/services}
]]
