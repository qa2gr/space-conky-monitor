-- VPS status as a constellation in the top-left of the HDMI-A-1 wallpaper's
-- round window. Drawn by lua/vps.lua.
-- Runs as its own conky instance:  conky -c ~/.config/conky/vps.conf
--
-- The glass circle is centred at (960, 540) on HDMI-A-1 (radius ~391), and
-- HDMI-A-1 is at +2560+360 on the XWayland screen, so this window's top-left
-- at (620, 200) on the monitor is gap_x 3180, gap_y 560.
-- If you move it, update CX/CY in lua/vps.lua.

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('vps', {
    gap_x = 3180,
    gap_y = 560,
    minimum_width = 440,
    maximum_width = 440,
    minimum_height = 360,
})

-- Every 30 s: Tailscale-ping the VPSes and save the result for the Lua script.
-- Written to a temp file first so the widget never reads a half-written one.
-- The command prints nothing, so nothing shows as text.
conky.text = [[
${execi 30 mkdir -p ~/.cache/conky && ~/.config/conky/scripts/vps.sh > ~/.cache/conky/vps-status.tmp && mv ~/.cache/conky/vps-status.tmp ~/.cache/conky/vps-status}
]]
