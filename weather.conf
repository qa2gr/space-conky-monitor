--[[
  Weather (Conky Mirage): how big the widget is and where it goes. The widget
  itself is drawn by lua/weather.lua.

  Runs as its own conky instance:  conky -c ~/.config/conky/weather.conf
]]

-- How big it is. "auto" picks a size for the monitor below. Or a number: 1.0
-- is the normal size, 1.2 is a fifth bigger.
-- With only the 24-hour box shown (show_hourly in lua/weather.lua) the widget is
-- 816x236, which fits the 2nd monitor at full size. If you turn more boxes on,
-- lower this so it stays above the Claude and media widgets (right side).
local scale = 0.8

-- Which monitor it goes on (a name from `xrandr --listmonitors`), or nil for
-- the whole screen. With several monitors, XWayland is one big screen, so the
-- margins below are measured from this monitor's edges instead.
local monitor = 'HDMI-A-1'

-- Where it goes: top_left, top_right, bottom_left, bottom_right, middle_left,
-- middle_right and so on, and how far from the edge of the monitor, in pixels
-- (not scaled).
local position = 'top_right'
local margin_x, margin_y = 10, 875  -- card's bottom level with the system monitor's (y 1040 on HDMI-A-1), below the calendar

-- Frames per second. Set target_fps in lua/weather.lua to the same number.
local fps = 1

-- The widget's normal size. If you change sizes in lua/weather.lua, conky prints
-- the numbers to put here when it starts.
local base_width, base_height = 784, 236   -- only show_hourly is on

-- Extra room on the window's left, in pixels (not scaled), for the box's
-- left side that curves around the wallpaper's round window (lua/weather.lua
-- reads this number from here).
local left_ext = 130

---------------------------------------------------------------------------

local function command(text)
    local pipe = io.popen(text .. " 2>/dev/null")
    if not pipe then return "" end
    local out = pipe:read("a") or ""
    pipe:close()
    return out
end

-- The monitor the widget lands on: the one named above, else the primary one.
-- Returns x, y, width, height on the XWayland screen.
local function monitor_geometry()
    local listing = command("xrandr --listmonitors")
    local geo = "(%d+)/%d+x(%d+)/%d+%+(%-?%d+)%+(%-?%d+)"
    local w, h, x, y
    if monitor then
        local name = monitor:gsub("%p", "%%%0")
        w, h, x, y = listing:match("%+%*?" .. name .. "%s+" .. geo)
    end
    if not w then w, h, x, y = listing:match("%+%*%S+%s+" .. geo) end
    if not w then w, h, x, y = listing:match(geo) end
    if not w then return nil end
    return tonumber(x), tonumber(y), tonumber(w), tonumber(h)
end

-- The whole XWayland screen, for right/bottom alignments.
local function screen_size()
    local w, h = command("xrandr --current"):match("current (%d+) x (%d+)")
    return tonumber(w), tonumber(h)
end

local mon_x, mon_y, mon_w, mon_h = monitor_geometry()

if scale == "auto" then
    local h = mon_h or 1440
    scale = math.min(math.max(h / 1440, 0.85), (h - 80) / base_height)
end
scale = math.max(0.45, math.min(tonumber(scale) or 1, 3))

local width  = math.floor(base_width * scale + 0.5) + left_ext
local height = math.floor(base_height * scale + 0.5)

-- conky's gap_x/gap_y count from the edges of the whole screen; turn the
-- margins into distances from the chosen monitor's edges.
local gap_x, gap_y = margin_x, margin_y
if mon_x then
    local _, sh = screen_size()
    if position:find("left") then
        gap_x = mon_x + margin_x
    elseif position:find("right") then
        -- conky measures right alignments from the first monitor, not the
        -- whole screen, so place the window from the left edge instead.
        position = position:gsub("right", "left")
        gap_x = mon_x + mon_w - width - margin_x
    end
    if position:find("top") then
        gap_y = mon_y + margin_y
    elseif position:find("bottom") and sh then
        gap_y = (sh - mon_y - mon_h) + margin_y
    end
end

-- conky re-reads this file when you save it, but on reload it keeps the old
-- window size, so a new scale or base size wouldn't show until a restart.
-- When the size differs from the last one used, start a fresh copy of this
-- conky; lua/weather.lua lets the newest copy take over and the old one closes.
do
    local cache = (os.getenv("XDG_CACHE_HOME") or (os.getenv("HOME") .. "/.cache")) .. "/conky/weather"
    local stamp = cache .. "/window-size"
    local size = width .. "x" .. height
    local file = io.open(stamp, "r")
    local last = file and file:read("l")
    if file then file:close() end
    if last ~= size then
        os.execute("mkdir -p '" .. cache .. "'")
        file = io.open(stamp, "w")
        if file then file:write(size, "\n"); file:close() end
        -- Only on a reload: a first start with a new size is already right.
        -- A conky that has been running for a while has an older start time
        -- than this second; field 22 of /proc/self/stat is the start time
        -- in clock ticks since boot, /proc/uptime the seconds since boot.
        local stat = io.open("/proc/self/stat"):read("a")
        local started = tonumber(stat:match("%) .*"):match("^%)" .. ("%s+%S+"):rep(19) .. "%s+(%d+)"))
        local uptime = tonumber(io.open("/proc/uptime"):read("a"):match("^([%d%.]+)"))
        local ticks = tonumber(command("getconf CLK_TCK")) or 100
        if last and started and uptime and uptime - started / ticks > 5 then
            local args = {}
            for arg in (io.open("/proc/self/cmdline"):read("a") or ""):gmatch("[^%z]+") do
                args[#args + 1] = "'" .. arg:gsub("'", "'\\''") .. "'"
            end
            local cwd = command("readlink /proc/self/cwd"):gsub("%s+$", "")
            if #args > 0 then
                os.execute("cd '" .. cwd:gsub("'", "'\\''") .. "' && (sleep 1; exec " ..
                           table.concat(args, " ") .. ") >/dev/null 2>&1 &")
            end
        end
    end
end

local widget = dofile(os.getenv('HOME') .. '/.config/conky/base.conf')

conky.config = widget('weather', {
    update_interval = 1 / fps,
    override_utf8_locale = true,
    border_width = 0,

    minimum_width = width,
    maximum_width = width,
    minimum_height = height,

    alignment = position,
    gap_x = gap_x,
    gap_y = gap_y,
})

conky.text = [[]]
